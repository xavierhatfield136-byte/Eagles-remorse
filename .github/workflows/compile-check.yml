name: Verification

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile check
        shell: pwsh
        run: ./scripts/check-compile.ps1

      - name: Verification
        shell: pwsh
        run: ./gradlew --no-daemon check
