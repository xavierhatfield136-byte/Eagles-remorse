name: Linux Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verification
        run: ./gradlew --no-daemon currentReleaseVerification

      - name: Build Linux package
        run: ./gradlew --no-daemon phase11LinuxPackaging

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EaglesRemorse-linux-package
          path: |
            build/package/linux/*.tar.gz
            build/package/linux/SHA256SUMS-linux.txt

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/package/linux/*.tar.gz
            build/package/linux/SHA256SUMS-linux.txt
