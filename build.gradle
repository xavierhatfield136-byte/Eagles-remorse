tasks.register("multiplayerLanAcceptanceHost", JavaExec) {
    group = "verification"
    description = "Run the V1 multiplayer direct-LAN acceptance host. Override with -PmpPort, -PmpHostAddress, -PmpReport, -PmpMatch, -PmpTimeoutMs, -PmpLoopback."
    dependsOn(tasks.named("classes"))
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "MultiplayerLanDuelAcceptanceHarness"
    doFirst {
        def port = (findProperty("mpPort") ?: "46717").toString()
        def report = (findProperty("mpReport") ?: "build/reports/multiplayer-lan-host-acceptance.txt").toString()
        def match = (findProperty("mpMatch") ?: "manual-lan-acceptance").toString()
        def timeout = (findProperty("mpTimeoutMs") ?: "30000").toString()
        def hostAddress = (findProperty("mpHostAddress") ?: "").toString()
        args("host", "--port=${port}", "--host-address=${hostAddress}", "--match=${match}", "--timeout-ms=${timeout}", "--report=${report}")
        if ((findProperty("mpLoopback") ?: "false").toString().toBoolean()) {
            args("--loopback=true")
        }
    }
}

