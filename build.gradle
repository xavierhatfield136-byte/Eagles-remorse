plugins {
    id "java"
    id "application"
}

def appDisplayName = "Eagles Remorse"
def appBundleName = "EaglesRemorse"
def rawVersion = file("VERSION").exists() ? file("VERSION").text.trim() : "dev"
def versionMatcher = (rawVersion =~ /(\d+)(?:\.(\d+))?(?:\.(\d+))?/)
def packageVersion = versionMatcher.find()
        ? [versionMatcher.group(1), versionMatcher.group(2) ?: "0", versionMatcher.group(3) ?: "0"].join(".")
        : "0.0.0"

version = rawVersion

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }
        resources {
            srcDirs = ["assets"]
            exclude "**/dropbox/**"
            exclude "ai_pipeline/**"
            exclude "audio/dropoff/**"
            exclude "base_station_generation/**"
            exclude "newshipskins/**"
            exclude "shipskinsupdate/**"
            exclude "station_concepts/**"
            exclude "station_module_generation/**"
            exclude "station_module_generation_clean/**"
            exclude "station_module_generation_tighttest/**"
            exclude "turret_skin_generation/**"
            exclude "**/backup*/**"
            exclude "**/*.bak"
            exclude "**/*.old"
            exclude "**/*.psd"
            exclude "**/*.tmp"
            exclude "**/*.zip"
        }
    }
    test {
        java {
            srcDirs = ["test"]
        }
    }
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

application {
    mainClass = "Main"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

def straySourceClassTree = {
    fileTree("${rootDir}/src") {
        include "**/*.class"
    }
}

tasks.register("purgeStraySourceClasses", Delete) {
    group = "build setup"
    description = "Remove compiled .class artifacts that were written into src."
    delete(straySourceClassTree())
}

tasks.register("verifySourceTreeHygiene") {
    group = "verification"
    description = "Fail if compiled .class artifacts are present inside src."
    dependsOn("purgeStraySourceClasses")
    doLast {
        def leftovers = straySourceClassTree().files
        if (!leftovers.isEmpty()) {
            throw new GradleException("Compiled .class artifacts are still present in src:\n - " + leftovers.join("\n - "))
        }
    }
}

tasks.named("processResources") {
    from(rootDir) {
        include "VERSION"
    }
}

tasks.named("jar") {
    manifest {
        attributes(
                "Main-Class": application.mainClass.get(),
                "Implementation-Title": appDisplayName,
                "Implementation-Version": project.version.toString()
        )
    }
}

test {
    useJUnitPlatform()
    systemProperty "codex.disableAudio", "true"
    systemProperty "game.userDataDir", layout.buildDirectory.dir("test-user-data").get().asFile.absolutePath
    doFirst {
        delete(layout.buildDirectory.dir("test-user-data"))
    }
    // Simulation tests retain decoded visual assets and static effect state between classes.
    // Keep workers short-lived and sized for multipart sprite decode coverage.
    forkEvery = 3
    maxHeapSize = "2048m"
}

tasks.named("compileJava") {
    dependsOn("purgeStraySourceClasses")
}

tasks.named("test") {
    dependsOn("purgeStraySourceClasses")
}

tasks.named("run") {
    dependsOn("purgeStraySourceClasses")
}

tasks.named("check") {
    dependsOn("verifySourceTreeHygiene")
}

tasks.register("phase4Smoke", JavaExec) {
    group = "verification"
    description = "Run the fast Phase 4 systems smoke harness."
    dependsOn(tasks.named("classes"))
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "Phase4SystemsHarness"
    args("--strict")
}

