plugins {
    id "java"
    id "application"
    id "checkstyle"
    id "pmd"
    id "com.github.spotbugs" version "6.4.4"
}

def appDisplayName = "Eagles Remorse"
def appBundleName = "EaglesRemorse"
def rawVersion = file("VERSION").exists() ? file("VERSION").text.trim() : "dev"
def versionMatcher = (rawVersion =~ /(\d+)(?:\.(\d+))?(?:\.(\d+))?/)
def packageVersion = versionMatcher.find()
        ? [versionMatcher.group(1), versionMatcher.group(2) ?: "0", versionMatcher.group(3) ?: "0"].join(".")
        : "0.0.0"

version = rawVersion

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }
        resources {
            srcDirs = ["assets"]
        }
    }
    test {
        java {
            srcDirs = ["test"]
        }
    }
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

application {
    mainClass = "Main"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

def straySourceClassTree = {
    fileTree("${rootDir}/src") {
        include "**/*.class"
    }
}

tasks.register("purgeStraySourceClasses", Delete) {
    group = "build setup"
    description = "Remove compiled .class artifacts that were written into src."
    delete(straySourceClassTree())
}

tasks.register("verifySourceTreeHygiene") {
    group = "verification"
    description = "Fail if compiled .class artifacts are present inside src."
    dependsOn("purgeStraySourceClasses")
    doLast {
        def leftovers = straySourceClassTree().files
        if (!leftovers.isEmpty()) {
            throw new GradleException("Compiled .class artifacts are still present in src:\n - " + leftovers.join("\n - "))
        }
    }
}

tasks.named("processResources") {
    from(rootDir) {
        include "VERSION"
    }
}

tasks.named("jar") {
    manifest {
        attributes(
                "Main-Class": application.mainClass.get(),
                "Implementation-Title": appDisplayName,
                "Implementation-Version": project.version.toString()
        )
    }
}

test {
    useJUnitPlatform()
}

tasks.named("compileJava") {
    dependsOn("purgeStraySourceClasses")
}

tasks.named("test") {
    dependsOn("purgeStraySourceClasses")
}

tasks.named("run") {
    dependsOn("purgeStraySourceClasses")
}

tasks.named("check") {
    dependsOn("verifySourceTreeHygiene")
}

tasks.register("phase4Smoke", JavaExec) {
    group = "verification"
    description = "Run the fast Phase 4 systems smoke harness."
    dependsOn(tasks.named("classes"))
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "Phase4SystemsHarness"
    args("--strict")
}

tasks.register("phase9Smoke", JavaExec) {
    group = "verification"
    description = "Run the deterministic Phase 9 smoke harness."
    dependsOn(tasks.named("classes"))
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "Phase9DeterminismHarness"
    args("--strict", "--seconds=60")
}

tasks.register("stabilitySmoke") {
    group = "verification"
    description = "Run the lightweight regression smoke suite."
    dependsOn("phase4Smoke", "phase9Smoke", "test")
}

checkstyle {
    toolVersion = "10.26.1"
}

tasks.withType(Checkstyle).configureEach {
    ignoreFailures = true
    showViolations = false
    reports {
        html.required.set(true)
        xml.required.set(false)
    }
}

pmd {
    toolVersion = "7.15.0"
    consoleOutput = false
    ignoreFailures = true
    ruleSetFiles = files("${rootDir}/config/pmd/ruleset.xml")
    ruleSets = []
}

tasks.withType(Pmd).configureEach {
    reports {
        html.required.set(true)
        xml.required.set(false)
    }
}

spotbugs {
    effort = com.github.spotbugs.snom.Effort.valueOf("MAX")
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf("MEDIUM")
    ignoreFailures = true
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required.set(true)
        xml.required.set(false)
    }
}

tasks.named("check") {
    dependsOn("spotbugsMain")
}

def isWindowsHost = {
    System.getProperty("os.name").toLowerCase(Locale.US).contains("win")
}

def commandExists = { String command ->
    if (!isWindowsHost()) {
        return false
    }
    def process = new ProcessBuilder("where.exe", command)
            .redirectErrorStream(true)
            .start()
    process.waitFor() == 0
}

def hasWixTools = {
    commandExists("candle.exe") && commandExists("light.exe")
}

def windowsJpackageInputDir = layout.buildDirectory.dir("jpackage/windows-input")

tasks.register("stageWindowsPackageInput", Sync) {
    dependsOn(tasks.named("jar"))
    from(tasks.named("jar"))
    into(windowsJpackageInputDir)
}

def configureWindowsJpackageTask = { Exec task, String type ->
    task.dependsOn(tasks.named("stageWindowsPackageInput"))
    task.group = "distribution"
    task.workingDir = rootDir
    task.doFirst {
        if (!isWindowsHost()) {
            throw new GradleException("Windows packaging tasks can only run on Windows hosts.")
        }
        if (type == "exe" && !hasWixTools()) {
            throw new GradleException("Windows EXE packaging requires WiX on PATH (candle.exe and light.exe).")
        }
        def packageDir = layout.buildDirectory.dir("package/windows").get().asFile
        packageDir.mkdirs()
        delete(windowsJpackageInputDir)
        copy {
            from(tasks.named("jar"))
            into(windowsJpackageInputDir)
        }
        if (type == "app-image") {
            delete(new File(packageDir, appBundleName))
        } else if (type == "exe") {
            delete(fileTree(packageDir) {
                include "${appBundleName}*.exe"
                include "${appBundleName}*.msi"
            })
        }
    }

    def jarTask = tasks.named("jar").get()
    def argsList = [
            "--type", type,
            "--input", windowsJpackageInputDir.get().asFile.absolutePath,
            "--dest", layout.buildDirectory.dir("package/windows").get().asFile.absolutePath,
            "--name", appBundleName,
            "--main-jar", jarTask.archiveFileName.get(),
            "--main-class", application.mainClass.get(),
            "--app-version", packageVersion,
            "--vendor", "xhatf",
            "--description", appDisplayName,
            "--java-options", "-Dfile.encoding=UTF-8"
    ]
    if (type == "exe") {
        argsList.addAll(["--win-dir-chooser", "--win-menu", "--win-shortcut"])
    }
    task.commandLine("jpackage", *argsList)
}

tasks.register("packageWindowsAppImage", Exec) {
    description = "Build a Windows app-image with a bundled runtime."
    configureWindowsJpackageTask(delegate as Exec, "app-image")
}

tasks.register("packageWindowsExe", Exec) {
    description = "Build a Windows EXE installer with a bundled runtime."
    configureWindowsJpackageTask(delegate as Exec, "exe")
}

tasks.register("packageWindowsZip", Zip) {
    group = "distribution"
    description = "Zip the portable Windows app-image for sharing."
    dependsOn("packageWindowsAppImage")
    archiveFileName = "${appBundleName}-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir("package/windows")
    from(layout.buildDirectory.dir("package/windows/${appBundleName}"))
}

tasks.register("packageWindows") {
    group = "distribution"
    description = "Build the Windows app-image, a shareable ZIP, and, when WiX is available, the EXE installer."
    dependsOn("packageWindowsZip")
    if (isWindowsHost() && hasWixTools()) {
        dependsOn("packageWindowsExe")
    }
    doLast {
        if (!isWindowsHost()) {
            return
        }
        if (!hasWixTools()) {
            logger.lifecycle("WiX was not found on PATH, so the EXE installer was skipped. Install WiX and run packageWindowsExe to build it.")
        }
    }
}
